// Common types for GSS gRPC services.
// Based on NuRec patterns for camera/pose representation.

syntax = "proto3";

package gss;

option java_package = "com.gss.grpc";

// 3D vector
message Vec3 {
    float x = 1;
    float y = 2;
    float z = 3;
}

// Quaternion (w, x, y, z)
message Quat {
    float w = 1;
    float x = 2;
    float y = 3;
    float z = 4;
}

// 6-DOF pose (position + orientation)
message Pose {
    Vec3 position = 1;
    Quat orientation = 2;
}

// Empty message for parameterless RPCs
message Empty {}
