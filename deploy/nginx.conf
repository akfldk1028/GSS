# GSS API — nginx reverse proxy
# Place in /etc/nginx/sites-available/gss-api and symlink to sites-enabled

upstream gss_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2G;

    # Long timeouts for pipeline processing
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 30s;

    location / {
        proxy_pass http://gss_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static file downloads — bypass to uvicorn (or serve directly)
    location /downloads/ {
        proxy_pass http://gss_backend;
        proxy_buffering off;
    }
}
